<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鼎丰运行看板</title>
    <link rel="stylesheet" href="./monitor.css" />
  </head>
  <body>
    <main class="monitor-shell">
      <header class="monitor-header">
        <div>
          <strong>鼎丰运行看板</strong>
          <span id="monitorRoot">当前实例</span>
        </div>
        <small id="monitorUpdated">等待刷新</small>
      </header>
      <section class="monitor-board" aria-live="polite">
        <div class="metric-card metric-primary">
          <span>分钟请求速度</span>
          <strong id="metricRequestRate">0/min</strong>
        </div>
        <div class="metric-card metric-primary">
          <span>分钟保存速度</span>
          <strong id="metricSaveRate">0/min</strong>
        </div>
        <div class="metric-card metric-success">
          <span>分钟成功访问比例</span>
          <strong id="metricAccessSuccessRate">--</strong>
        </div>
        <div class="metric-card metric-risk">
          <span>分钟 502 占比</span>
          <strong id="metric502Rate">0%</strong>
        </div>
        <div class="metric-card">
          <span>分钟 .do 在途</span>
          <strong id="metricDoInflight">0/0</strong>
        </div>
        <div class="metric-card">
          <span>实时剩余底料</span>
          <strong id="metricRemaining">0</strong>
        </div>
        <div class="metric-card">
          <span>已保存</span>
          <strong id="metricSavedTotal">0</strong>
        </div>
        <div class="metric-card">
          <span>已完成</span>
          <strong id="metricCompletedTotal">0</strong>
        </div>
        <div class="metric-card metric-state">
          <span>状态</span>
          <strong id="metricRuntimeState">待启动</strong>
        </div>
        <div class="metric-card metric-timer">
          <span>运行计时</span>
          <strong id="runtimeTimer">00:00:00</strong>
        </div>
      </section>
    </main>
    <script src="./monitor.js"></script>
  </body>
</html>
